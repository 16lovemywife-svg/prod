{% extends "base.html" %}

{% block title %}
    {% if is_edit %}Редактирование{% else %}Добавление{% endif %} продукта
{% endblock %}

{% block content %}
<h1 style="color: var(--neon-green);">
    {% if is_edit %}✏️ Редактировать продукт{% else %}➕ Новый продукт{% endif %}
</h1>

<div class="card mt-3">
    <div class="card-body">
        <form method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label class="form-label">Название продукта *</label>
                <input type="text" name="name" class="form-control" 
                       value="{{ product.name if product else '' }}" required>
            </div>

            <div class="form-group">
                <label class="form-label">Категория</label>
                <input type="text" name="category" class="form-control" 
                       value="{{ product.category if product else '' }}" 
                       placeholder="мясо, овощи, крупы, молочные...">
            </div>

            <h3 style="color: var(--neon-orange); margin: 1.5rem 0 1rem;">Пищевая ценность (на 100 г)</h3>
            <div class="d-flex gap-3 flex-wrap">
                <div class="form-group" style="flex:1;">
                    <label class="form-label">Калории (ккал)</label>
                    <input type="number" name="calories" class="form-control" 
                           value="{{ product.calories if product else 0 }}" step="0.1" min="0">
                </div>
                <div class="form-group" style="flex:1;">
                    <label class="form-label">Белки (г)</label>
                    <input type="number" name="proteins" class="form-control" 
                           value="{{ product.proteins if product else 0 }}" step="0.1" min="0">
                </div>
                <div class="form-group" style="flex:1;">
                    <label class="form-label">Жиры (г)</label>
                    <input type="number" name="fats" class="form-control" 
                           value="{{ product.fats if product else 0 }}" step="0.1" min="0">
                </div>
                <div class="form-group" style="flex:1;">
                    <label class="form-label">Углеводы (г)</label>
                    <input type="number" name="carbs" class="form-control" 
                           value="{{ product.carbs if product else 0 }}" step="0.1" min="0">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Единица измерения по умолчанию</label>
                <select name="default_unit" class="form-control" style="max-width:200px;">
                    <option value="г" {% if product and product.default_unit == 'г' %}selected{% endif %}>г</option>
                    <option value="мл" {% if product and product.default_unit == 'мл' %}selected{% endif %}>мл</option>
                    <option value="шт" {% if product and product.default_unit == 'шт' %}selected{% endif %}>шт</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Фото продукта</label>
                <input type="file" name="image" class="form-control" accept="image/*">
            </div>

            <button type="submit" class="btn btn-success btn-lg btn-block mt-3">
                {% if is_edit %}💾 Сохранить{% else %}✅ Добавить продукт{% endif %}
            </button>
        </form>
    </div>
</div>
{% endblock %}
