{% extends "base.html" %}

{% block title %}Итоги и прогресс{% endblock %}

{% block content %}
<h1 style="color: var(--neon-blue);">📈 Итоги и прогресс</h1>

<!-- Переключатель периода -->
<div class="period-selector mb-4" style="display:flex; gap:0.5rem; flex-wrap:wrap;">
    <a href="{{ url_for('stats.stats', period='7') }}" class="btn btn-sm {% if period == '7' %}btn-primary{% else %}btn-outline{% endif %}">7 дней</a>
    <a href="{{ url_for('stats.stats', period='30') }}" class="btn btn-sm {% if period == '30' %}btn-primary{% else %}btn-outline{% endif %}">30 дней</a>
    <a href="{{ url_for('stats.stats', period='90') }}" class="btn btn-sm {% if period == '90' %}btn-primary{% else %}btn-outline{% endif %}">90 дней</a>
    <a href="{{ url_for('stats.stats', period='all') }}" class="btn btn-sm {% if period == 'all' %}btn-primary{% else %}btn-outline{% endif %}">Всё время</a>
</div>

<!-- Chart.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<div class="card mb-4">
    <div class="card-body">
        <h3>Калории за период</h3>
        <canvas id="weeklyCaloriesChart" width="400" height="200"></canvas>
    </div>
</div>

<div class="card mb-4">
    <div class="card-body">
        <h3>Прогресс веса и обхватов</h3>
        <canvas id="weightChart" width="400" height="200"></canvas>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
// Графики через Chart.js
document.addEventListener('DOMContentLoaded', function() {
    // Калории за период
    const ctx1 = document.getElementById('weeklyCaloriesChart').getContext('2d');
    new Chart(ctx1, {
        type: 'bar',
        data: {
            labels: {{ labels|tojson }},
            datasets: [
                { label: 'Потреблено', data: {{ calorie_intake|tojson }}, backgroundColor: '#ff6b35' },
                { label: 'Сожжено', data: {{ calorie_burn|tojson }}, backgroundColor: '#39ff14' }
            ]
        },
        options: {
            responsive: true,
            scales: {
                x: { title: { display: true, text: 'Дата' } },
                y: { title: { display: true, text: 'Калории' } }
            }
        }
    });

    // Прогресс веса и обхватов
    const ctx2 = document.getElementById('weightChart').getContext('2d');
    new Chart(ctx2, {
        type: 'line',
        data: {
            labels: {{ weight_labels|tojson }},
            datasets: [
                {
                    label: 'Вес (кг)',
                    data: {{ weight_data|tojson }},
                    borderColor: '#00d4ff',
                    backgroundColor: '#00d4ff',
                    yAxisID: 'y-weight',
                    tension: 0.2
                },
                {
                    label: 'Грудь (см)',
                    data: {{ chest_data|tojson }},
                    borderColor: '#ff6b35',
                    backgroundColor: '#ff6b35',
                    yAxisID: 'y-measure',
                    tension: 0.2
                },
                {
                    label: 'Талия (см)',
                    data: {{ waist_data|tojson }},
                    borderColor: '#ffd700',
                    backgroundColor: '#ffd700',
                    yAxisID: 'y-measure',
                    tension: 0.2
                },
                {
                    label: 'Бёдра (см)',
                    data: {{ hips_data|tojson }},
                    borderColor: '#39ff14',
                    backgroundColor: '#39ff14',
                    yAxisID: 'y-measure',
                    tension: 0.2
                },
                {
                    label: 'Бицепс (см)',
                    data: {{ biceps_data|tojson }},
                    borderColor: '#ff2d95',
                    backgroundColor: '#ff2d95',
                    yAxisID: 'y-measure',
                    tension: 0.2
                }
            ]
        },
        options: {
            responsive: true,
            interaction: {
                mode: 'index',
                intersect: false
            },
            scales: {
                'y-weight': {
                    type: 'linear',
                    position: 'left',
                    title: { display: true, text: 'Вес (кг)' }
                },
                'y-measure': {
                    type: 'linear',
                    position: 'right',
                    title: { display: true, text: 'Обхваты (см)' },
                    grid: { drawOnChartArea: false }
                }
            }
        }
    });
});
</script>
{% endblock %}
